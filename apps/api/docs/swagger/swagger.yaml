        이미지 유형 하나의 처리 방식만 바꾸고, 바뀐 뒤의 전체를 돌려준다. 다른 유형의 값은 그대로다.
        text: extract_and_translate · extract_text · summarize · extract_and_summarize
        receipt: record_expense · extract_text · summarize
      parameters:
