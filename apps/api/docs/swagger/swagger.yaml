basePath: /
definitions:
  httpserver.AuthorizeURLResponse:
    properties:
      authorizeUrl:
        example: https://accounts.google.com/o/oauth2/v2/auth?...
        type: string
    type: object
  httpserver.CapabilitiesResponse:
    properties:
      providers:
        example:
        - google
        items:
          type: string
        type: array
    type: object
  httpserver.ErrorResponse:
    properties:
      error:
        enum:
        - session_expired
        - provider_unavailable
        - invalid_callback
        - invalid_image
        - image_too_large
        - unsupported_image
        - job_not_found
        - invalid_onboarding
        - onboarding_complete
        - onboarding_out_of_order
        - invalid_preference
        example: session_expired
        type: string
    type: object
  httpserver.ExchangeRequest:
    properties:
      code:
        example: one-time-result-code
        type: string
      state:
        example: base64url-app-state-43-to-128-chars
        type: string
      verifier:
        example: base64url-app-verifier-43-to-128-chars
        type: string
    required:
    - code
    - state
    - verifier
    type: object
  httpserver.HandoffExchangeRequest:
    properties:
      code:
        example: one-time-handoff-code
        type: string
      next:
        enum:
        - /
        - /history
        - /settings/processing
        example: /history
        type: string
      verifier:
        example: base64url-web-verifier-43-to-128-chars
        type: string
    required:
    - code
    - next
    - verifier
    type: object
  httpserver.HandoffStartRequest:
    properties:
      challenge:
        example: base64url-S256-challenge-of-the-web-verifier
        type: string
      next:
        enum:
        - /
        - /history
        - /settings/processing
        example: /history
        type: string
    required:
    - challenge
    - next
    type: object
  httpserver.HandoffStartResponse:
    properties:
      code:
        example: one-time-handoff-code
        type: string
    type: object
  httpserver.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  httpserver.LoginResponse:
    properties:
      credential:
        example: opaque-session-credential
        type: string
      session:
        $ref: '#/definitions/httpserver.SessionResponse'
    type: object
  httpserver.OAuthCancelRequest:
    properties:
      state:
        example: base64url-app-state-43-to-128-chars
        type: string
    required:
    - state
    type: object
  httpserver.OAuthStartRequest:
    properties:
      challenge:
        example: base64url-S256-challenge-of-the-app-verifier
        type: string
      platform:
        enum:
        - mobile
        - web
        example: mobile
        type: string
      provider:
        example: google
        type: string
      state:
        example: base64url-app-state-43-to-128-chars
        type: string
    required:
    - challenge
    - platform
    - provider
    - state
    type: object
  httpserver.OnboardingRequest:
    properties:
      purposes:
        example:
        - food
        - receipt
        items:
          enum:
          - food
          - shopping
          - travel
          - events
          - receipt
          - foreign-language
          - work
          - unsure
          type: string
        type: array
      step:
        enum:
        - intro
        - purpose
        - first-image
        example: first-image
        type: string
    required:
    - step
    type: object
  httpserver.OnboardingResponse:
    properties:
      purposes:
        example:
        - food
        - receipt
        items:
          enum:
          - food
          - shopping
          - travel
          - events
          - receipt
          - foreign-language
          - work
          - unsure
          type: string
        type: array
      step:
        enum:
        - intro
        - purpose
        - first-image
        - complete
        example: first-image
        type: string
    type: object
  httpserver.ProcessingFactResponse:
    properties:
      label:
        example: 날짜
        type: string
      value:
        example: 8월 20일 19시
        type: string
    type: object
  httpserver.ProcessingJobResponse:
    properties:
      jobId:
        example: 4f1c2a9e-0000-4000-8000-000000000000
        type: string
      result:
        $ref: '#/definitions/httpserver.ProcessingResultResponse'
      status:
        enum:
        - running
        - completed
        - failed
        example: running
        type: string
    type: object
  httpserver.ProcessingPreferenceRequest:
    properties:
      action:
        enum:
        - extract_and_translate
        - extract_text
        - summarize
        - extract_and_summarize
        - record_expense
        example: summarize
        type: string
    required:
    - action
    type: object
  httpserver.ProcessingPreferencesResponse:
    properties:
      receipt:
        enum:
        - record_expense
        - extract_text
        - summarize
        example: record_expense
        type: string
      text:
        enum:
        - extract_and_translate
        - extract_text
        - summarize
        - extract_and_summarize
        example: extract_and_translate
        type: string
    type: object
  httpserver.ProcessingResultResponse:
    properties:
      category:
        enum:
        - place
        - event
        - receipt
        - foreign_text
        - shopping
        - work
        - other
        example: event
        type: string
      confidence:
        enum:
        - high
        - medium
        - low
        example: high
        type: string
      facts:
        items:
          $ref: '#/definitions/httpserver.ProcessingFactResponse'
        type: array
      suggestedAction:
        enum:
        - save_place
        - add_to_calendar
        - record_expense
        - translate
        - none
        example: add_to_calendar
        type: string
    type: object
  httpserver.SessionResponse:
    properties:
      expiresAt:
        example: "2026-10-01T00:00:00Z"
        format: date-time
        type: string
      onboardingStep:
        enum:
        - intro
        - purpose
        - first-image
        - complete
        example: intro
        type: string
      user:
        $ref: '#/definitions/httpserver.UserResponse'
    type: object
  httpserver.UserResponse:
    properties:
      id:
        example: 4f1c2a9e-0000-4000-8000-000000000000
        type: string
    type: object
info:
  contact: {}
  description: snapdone Go API. 인증 credential은 JWT가 아닌 opaque 서버 세션 토큰.
  title: snapdone API
  version: "0.1"
paths:
  /health:
    get:
      description: 프로세스가 요청을 받을 수 있는지 확인하는 운영용 endpoint. DB 상태는 보지 않는다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.HealthResponse'
      summary: 서버 상태
      tags:
      - health
  /v1/auth/capabilities:
    get:
      description: 서버에 설정 · 구현된 로그인 provider. 인증이 비활성이면 503이다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.CapabilitiesResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: 로그인 수단 목록
      tags:
      - auth
  /v1/auth/exchange:
    post:
      consumes:
      - application/json
      description: 콜백이 넘긴 result code를 앱 verifier · state와 함께 한 번만 세션으로 바꾼다.
      parameters:
      - description: result code · 앱 PKCE verifier · 앱 state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.LoginResponse'
        "400":
          description: 잘못된 요청 · 틀린 proof · 만료 · 재사용 (invalid_callback)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 · OAuth 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: 로그인 결과 교환
      tags:
      - oauth
  /v1/auth/handoff/exchange:
    post:
      consumes:
      - application/json
      description: web 서버가 verifier cookie와 코드로 앱 세션 아래 child web 세션을 받는다. 코드는 한 번만
        쓸 수 있다.
      parameters:
      - description: handoff 코드 · web verifier · next
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.HandoffExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.LoginResponse'
        "400":
          description: 잘못된 요청 · 틀린 proof · 만료 · 재사용 · parent 취소 (invalid_callback)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: WebView 핸드오프 교환
      tags:
      - handoff
  /v1/auth/handoff/start:
    post:
      consumes:
      - application/json
      description: |-
        앱이 자기 Bearer로 WebView용 30초 일회용 코드를 받는다. root mobile 세션만 받는다.
        challenge는 web 서버가 가진 verifier의 S256이고, next는 허용 목록(/ · /history) 안이어야 한다.
      parameters:
      - description: web verifier의 challenge · 이동할 web 경로
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.HandoffStartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.HandoffStartResponse'
        "400":
          description: 잘못된 요청 · challenge · next (invalid_callback)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: credential 없음 · 무효 · root mobile 세션 아님 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: WebView 핸드오프 코드 발급
      tags:
      - handoff
  /v1/auth/logout:
    post:
      description: 이 credential의 세션만 취소한다(root면 child 포함). 모르는 · 만료된 credential도 204다.
      responses:
        "204":
          description: No Content
        "401":
          description: Authorization 헤더 형식 오류 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 로그아웃
      tags:
      - auth
  /v1/auth/oauth/callback:
    get:
      description: |-
        provider가 브라우저를 돌려보내는 곳. 결과는 서버 설정의 앱 · web 복귀 URI로 302 redirect한다.
        성공이면 `code`(60초 · 일회용 result code)와 앱 `state`를, 실패면 `error`(cancelled · provider_unavailable · invalid_callback)와 앱 `state`를 query로 붙인다.
        provider 토큰은 넘기지 않는다. transaction을 찾지 못하면 redirect하지 않고 400이다.
      parameters:
      - description: 서버가 만든 provider state
        in: query
        name: state
        required: true
        type: string
      - description: provider authorization code
        in: query
        name: code
        type: string
      - description: 'provider 오류 (예: access_denied)'
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: 복귀 URI로 redirect
          headers:
            Location:
              description: 복귀 URI ?code=&state= 또는 ?error=&state=
              type: string
        "400":
          description: 모르는 · 이미 쓴 state (invalid_callback)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 · OAuth 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: provider 콜백
      tags:
      - oauth
  /v1/auth/oauth/cancel:
    post:
      consumes:
      - application/json
      description: 앱이 취소한 시작을 폐기한다. 본문이 잘못됐거나 모르는 state여도 204다.
      parameters:
      - description: 시작할 때 보낸 앱 state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.OAuthCancelRequest'
      responses:
        "204":
          description: No Content
        "503":
          description: 인증 · OAuth 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: 로그인 취소
      tags:
      - oauth
  /v1/auth/oauth/start:
    post:
      consumes:
      - application/json
      description: |-
        앱 PKCE challenge · state로 OAuth transaction을 만들고 provider 동의 화면 주소를 돌려준다.
        Google state · PKCE verifier · nonce는 앱 값과 별개로 서버가 새로 만든다. 같은 앱 state는 한 번만 쓸 수 있다.
      parameters:
      - description: provider · 앱 challenge(S256) · 앱 state · platform
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.OAuthStartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.AuthorizeURLResponse'
        "400":
          description: 잘못된 요청 · 미설정 provider · state 재사용 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 · OAuth 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: 로그인 시작
      tags:
      - oauth
  /v1/auth/session:
    get:
      description: Bearer credential의 세션을 확인하고 idle 만료를 연장한다. 만료 · 취소 · 모르는 credential은
        401이다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.SessionResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 현재 세션
      tags:
      - auth
  /v1/onboarding:
    get:
      description: 내 온보딩 단계와 사용 목적. mobile과 web이 같은 진행에서 이어 간다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.OnboardingResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 온보딩 진행
      tags:
      - onboarding
    put:
      consumes:
      - application/json
      description: |-
        단계(intro · purpose · first-image)와 사용 목적을 저장한다. 목적은 first-image에서만 있고 빈 목록은 건너뜀이다.
        unsure는 혼자만 고를 수 있다. 같은 단계를 다시 저장하거나 한 단계 앞으로만 갈 수 있고, 온보딩을 마친 뒤에는 바꿀 수 없다.
      parameters:
      - description: 저장할 진행
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpserver.OnboardingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.OnboardingResponse'
        "400":
          description: 계약 밖의 진행 (invalid_onboarding)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "409":
          description: 이미 마친 온보딩 (onboarding_complete) · 건너뛰거나 되돌아가는 단계 (onboarding_out_of_order)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 온보딩 진행 저장
      tags:
      - onboarding
  /v1/onboarding/complete:
    post:
      description: |-
        첫 사진 단계(first-image)에서 온보딩을 끝낸다. 본문은 없고 사용 목적은 바꾸지 않는다.
        이미 마쳤으면 그대로 성공한다 — 두 번 누르거나 다른 기기 · 탭이 먼저 마쳐도 오류가 아니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.OnboardingResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "409":
          description: 첫 사진 단계 전 (onboarding_out_of_order)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 온보딩 완료
      tags:
      - onboarding
  /v1/processing-jobs:
    post:
      consumes:
      - multipart/form-data
      description: |-
        사진 한 장(multipart 필드 image)으로 처리 작업을 만들고 바로 돌아온다. 결과는 작업 조회로 받는다.
        JPEG · PNG · GIF · WebP만 받고 7,500,000 byte까지다. 사진은 저장하지 않는다.
      parameters:
      - description: 사진 한 장
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/httpserver.ProcessingJobResponse'
        "400":
          description: multipart가 아니거나 image 필드 없음 (invalid_image)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "413":
          description: 상한 초과 (image_too_large)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "415":
          description: 지원하지 않는 형식 (unsupported_image)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 처리 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 사진 처리 시작
      tags:
      - processing
  /v1/processing-jobs/{jobId}:
    get:
      description: 내 처리 작업의 상태와, 완료됐다면 결과. 다른 사용자의 작업은 없는 작업과 같다.
      parameters:
      - description: 처리 시작이 돌려준 jobId
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.ProcessingJobResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
