basePath: /
definitions:
  httpserver.AuthorizeURLResponse:
    properties:
      authorizeUrl:
        example: https://accounts.google.com/o/oauth2/v2/auth?...
        type: string
    type: object
  httpserver.CapabilitiesResponse:
    properties:
      providers:
        example:
        - google
        items:
          type: string
        type: array
    type: object
  httpserver.DeleteJobsRequest:
    properties:
      jobIds:
        example:
        - 0f8fad5b-d9cb-469f-a165-70867728950e
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
    required:
    - jobIds
    type: object
  httpserver.DeleteJobsResponse:
    properties:
      deleted:
        example: 2
        type: integer
    type: object
  httpserver.ErrorResponse:
    properties:
      error:
        enum:
        - session_expired
        - provider_unavailable
        - invalid_callback
        - invalid_image
        - image_too_large
        - unsupported_image
        - job_not_found
        - invalid_onboarding
        - onboarding_complete
        - onboarding_out_of_order
        - invalid_preference
        - invalid_reprocess
        - image_mismatch
        - source_running
        - source_not_reprocessable
        - invalid_receipt_field
        - job_not_resolvable
        - receipt_field_resolved
        example: session_expired
        type: string
    type: object
  httpserver.ExchangeRequest:
    properties:
      code:
        example: one-time-result-code
        type: string
      state:
        example: base64url-app-state-43-to-128-chars
        type: string
      verifier:
        example: base64url-app-verifier-43-to-128-chars
        type: string
    required:
    - code
    - state
    - verifier
    type: object
  httpserver.HandoffExchangeRequest:
    properties:
      code:
        example: one-time-handoff-code
        type: string
      next:
        example: /history/4f1c2a9e-0000-4000-8000-000000000000
        type: string
      verifier:
        example: base64url-web-verifier-43-to-128-chars
        type: string
    required:
    - code
    - next
    - verifier
    type: object
  httpserver.HandoffStartRequest:
    properties:
      challenge:
        example: base64url-S256-challenge-of-the-web-verifier
        type: string
      next:
        example: /history/4f1c2a9e-0000-4000-8000-000000000000
        type: string
    required:
    - challenge
    - next
    type: object
  httpserver.HandoffStartResponse:
    properties:
      code:
        example: one-time-handoff-code
        type: string
    type: object
  httpserver.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  httpserver.LoginResponse:
    properties:
      credential:
        example: opaque-session-credential
        type: string
      session:
        $ref: '#/definitions/httpserver.SessionResponse'
    type: object
  httpserver.OAuthCancelRequest:
    properties:
      state:
        example: base64url-app-state-43-to-128-chars
        type: string
    required:
    - state
    type: object
  httpserver.OAuthStartRequest:
    properties:
      challenge:
        example: base64url-S256-challenge-of-the-app-verifier
        type: string
      platform:
        enum:
        - mobile
        - web
        example: mobile
        type: string
      provider:
        example: google
        type: string
      state:
        example: base64url-app-state-43-to-128-chars
        type: string
    required:
    - challenge
    - platform
    - provider
    - state
    type: object
  httpserver.OnboardingRequest:
    properties:
      step:
        enum:
        - intro
        - first-image
        example: first-image
        type: string
    required:
    - step
    type: object
  httpserver.OnboardingResponse:
    properties:
      step:
        enum:
        - intro
        - first-image
        - complete
        example: first-image
        type: string
    type: object
  httpserver.ProcessingFactResponse:
    properties:
      label:
        example: 날짜
        type: string
      value:
        example: 8월 20일 19시
        type: string
    type: object
  httpserver.ProcessingJobListResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/httpserver.ProcessingJobSummaryResponse'
        type: array
    type: object
  httpserver.ProcessingJobResponse:
    properties:
      jobId:
        example: 4f1c2a9e-0000-4000-8000-000000000000
        type: string
      outcome:
        $ref: '#/definitions/httpserver.ProcessingOutcomeResponse'
      result:
        $ref: '#/definitions/httpserver.ProcessingResultResponse'
      selection:
        $ref: '#/definitions/httpserver.ProcessingSelectionResponse'
      sourceJobId:
        example: 4f1c2a9e-0000-4000-8000-000000000001
        type: string
      status:
        enum:
        - running
        - completed
        - failed
        example: running
        type: string
    type: object
  httpserver.ProcessingJobSummaryResponse:
    properties:
      createdAt:
        example: "2026-10-06T09:00:00Z"
        format: date-time
        type: string
      finishedAt:
        example: "2026-10-06T09:00:07Z"
        format: date-time
        type: string
      jobId:
        example: 4f1c2a9e-0000-4000-8000-000000000000
        type: string
      outcome:
        $ref: '#/definitions/httpserver.ProcessingOutcomeResponse'
      result:
        $ref: '#/definitions/httpserver.ProcessingResultResponse'
      selection:
        $ref: '#/definitions/httpserver.ProcessingSelectionResponse'
      sourceJobId:
        example: 4f1c2a9e-0000-4000-8000-000000000001
        type: string
      status:
        enum:
        - running
        - completed
        - failed
        example: completed
        type: string
    type: object
  httpserver.ProcessingOutcomeResponse:
    properties:
      appliedAction:
        enum:
        - extract_and_translate
        - extract_text
        - summarize
        - extract_and_summarize
        - record_expense
        example: extract_text
        type: string
      candidates:
        example:
        - text
        - receipt
        items:
          enum:
          - text
          - receipt
          type: string
        type: array
      imageType:
        enum:
        - text
        - receipt
        example: text
        type: string
      kind:
        enum:
        - processed
        - unsupported
        - ambiguous
        example: processed
        type: string
      output:
        $ref: '#/definitions/httpserver.ProcessingOutputResponse'
    type: object
  httpserver.ProcessingOutputResponse:
    properties:
      expense:
        $ref: '#/definitions/httpserver.ReceiptExpenseResponse'
      original:
        example: Open daily 9am-6pm
        type: string
      summary:
        example: 영업시간 안내
        type: string
      translation:
        $ref: '#/definitions/httpserver.TranslationResponse'
    type: object
  httpserver.ProcessingPreferenceRequest:
    properties:
      action:
        enum:
        - extract_and_translate
        - extract_text
        - summarize
        - extract_and_summarize
        - record_expense
        example: summarize
        type: string
    required:
    - action
    type: object
  httpserver.ProcessingPreferencesResponse:
    properties:
      receipt:
        enum:
        - record_expense
        - extract_text
        - summarize
        example: record_expense
        type: string
      text:
        enum:
        - extract_and_translate
        - extract_text
        - summarize
        - extract_and_summarize
        example: extract_and_translate
        type: string
    type: object
  httpserver.ProcessingResultResponse:
    properties:
      category:
        enum:
        - place
        - event
        - receipt
        - foreign_text
        - shopping
        - work
        - other
        example: event
        type: string
      confidence:
        enum:
        - high
        - medium
        - low
        example: high
        type: string
      facts:
        items:
          $ref: '#/definitions/httpserver.ProcessingFactResponse'
        type: array
      suggestedAction:
        enum:
        - save_place
        - add_to_calendar
        - record_expense
        - translate
        - none
        example: add_to_calendar
        type: string
    type: object
  httpserver.ProcessingSelectionResponse:
    properties:
      appliedAction:
        enum:
        - extract_and_translate
        - extract_text
        - summarize
        - extract_and_summarize
        - record_expense
        example: extract_and_translate
        type: string
      imageType:
        enum:
        - text
        - receipt
        example: text
        type: string
    type: object
  httpserver.ReceiptExpenseResponse:
    properties:
      currency:
        $ref: '#/definitions/httpserver.ReceiptFieldResponse'
      date:
        $ref: '#/definitions/httpserver.ReceiptFieldResponse'
      merchant:
        $ref: '#/definitions/httpserver.ReceiptFieldResponse'
      paymentMethod:
        $ref: '#/definitions/httpserver.ReceiptFieldResponse'
      total:
        $ref: '#/definitions/httpserver.ReceiptFieldResponse'
    type: object
  httpserver.ReceiptFieldRequest:
    properties:
      value:
        example: "12000"
        type: string
    required:
    - value
    type: object
  httpserver.ReceiptFieldResponse:
    properties:
      candidates:
        example:
        - "12000"
        - "13000"
        items:
          type: string
        type: array
      resolved:
        example: false
        type: boolean
      value:
        example: "12000"
        type: string
    type: object
  httpserver.SessionResponse:
    properties:
      expiresAt:
        example: "2026-10-01T00:00:00Z"
        format: date-time
        type: string
      onboardingStep:
        enum:
        - intro
        - first-image
        - complete
        example: intro
        type: string
      user:
        $ref: '#/definitions/httpserver.UserResponse'
    type: object
  httpserver.TranslationResponse:
    properties:
      needed:
        example: true
        type: boolean
      text:
        example: 매일 오전 9시-오후 6시 영업
        type: string
    type: object
  httpserver.UserResponse:
    properties:
      id:
        example: 4f1c2a9e-0000-4000-8000-000000000000
        type: string
    type: object
info:
  contact: {}
  description: snapdone Go API. 인증 credential은 JWT가 아닌 opaque 서버 세션 토큰.
  title: snapdone API
  version: "0.1"
paths:
  /health:
    get:
      description: 프로세스가 요청을 받을 수 있는지 확인하는 운영용 endpoint. DB 상태는 보지 않는다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.HealthResponse'
      summary: 서버 상태
      tags:
      - health
  /v1/auth/capabilities:
    get:
      description: 서버에 설정 · 구현된 로그인 provider. 인증이 비활성이면 503이다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.CapabilitiesResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: 로그인 수단 목록
      tags:
      - auth
  /v1/auth/exchange:
    post:
      consumes:
      - application/json
      description: 콜백이 넘긴 result code를 앱 verifier · state와 함께 한 번만 세션으로 바꾼다.
      parameters:
      - description: result code · 앱 PKCE verifier · 앱 state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.LoginResponse'
        "400":
          description: 잘못된 요청 · 틀린 proof · 만료 · 재사용 (invalid_callback)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 · OAuth 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: 로그인 결과 교환
      tags:
      - oauth
  /v1/auth/handoff/exchange:
    post:
      consumes:
      - application/json
      description: web 서버가 verifier cookie와 코드로 앱 세션 아래 child web 세션을 받는다. 코드는 한 번만
        쓸 수 있다.
      parameters:
      - description: handoff 코드 · web verifier · next
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.HandoffExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.LoginResponse'
        "400":
          description: 잘못된 요청 · 틀린 proof · 만료 · 재사용 · parent 취소 (invalid_callback)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: WebView 핸드오프 교환
      tags:
      - handoff
  /v1/auth/handoff/start:
    post:
      consumes:
      - application/json
      description: |-
        앱이 자기 Bearer로 WebView용 30초 일회용 코드를 받는다. root mobile 세션만 받는다.
        challenge는 web 서버가 가진 verifier의 S256이고, next는 허용 목록(/ · /history) 안이어야 한다.
      parameters:
      - description: web verifier의 challenge · 이동할 web 경로
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.HandoffStartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.HandoffStartResponse'
        "400":
          description: 잘못된 요청 · challenge · next (invalid_callback)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: credential 없음 · 무효 · root mobile 세션 아님 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: WebView 핸드오프 코드 발급
      tags:
      - handoff
  /v1/auth/logout:
    post:
      description: 이 credential의 세션만 취소한다(root면 child 포함). 모르는 · 만료된 credential도 204다.
      responses:
        "204":
          description: No Content
        "401":
          description: Authorization 헤더 형식 오류 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 로그아웃
      tags:
      - auth
  /v1/auth/oauth/callback:
    get:
      description: |-
        provider가 브라우저를 돌려보내는 곳. 결과는 서버 설정의 앱 · web 복귀 URI로 302 redirect한다.
        성공이면 `code`(60초 · 일회용 result code)와 앱 `state`를, 실패면 `error`(cancelled · provider_unavailable · invalid_callback)와 앱 `state`를 query로 붙인다.
        provider 토큰은 넘기지 않는다. transaction을 찾지 못하면 redirect하지 않고 400이다.
      parameters:
      - description: 서버가 만든 provider state
        in: query
        name: state
        required: true
        type: string
      - description: provider authorization code
        in: query
        name: code
        type: string
      - description: 'provider 오류 (예: access_denied)'
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: 복귀 URI로 redirect
          headers:
            Location:
              description: 복귀 URI ?code=&state= 또는 ?error=&state=
              type: string
        "400":
          description: 모르는 · 이미 쓴 state (invalid_callback)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 · OAuth 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: provider 콜백
      tags:
      - oauth
  /v1/auth/oauth/cancel:
    post:
      consumes:
      - application/json
      description: 앱이 취소한 시작을 폐기한다. 본문이 잘못됐거나 모르는 state여도 204다.
      parameters:
      - description: 시작할 때 보낸 앱 state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.OAuthCancelRequest'
      responses:
        "204":
          description: No Content
        "503":
          description: 인증 · OAuth 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: 로그인 취소
      tags:
      - oauth
  /v1/auth/oauth/start:
    post:
      consumes:
      - application/json
      description: |-
        앱 PKCE challenge · state로 OAuth transaction을 만들고 provider 동의 화면 주소를 돌려준다.
        Google state · PKCE verifier · nonce는 앱 값과 별개로 서버가 새로 만든다. 같은 앱 state는 한 번만 쓸 수 있다.
      parameters:
      - description: provider · 앱 challenge(S256) · 앱 state · platform
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.OAuthStartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.AuthorizeURLResponse'
        "400":
          description: 잘못된 요청 · 미설정 provider · state 재사용 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 · OAuth 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: 로그인 시작
      tags:
      - oauth
  /v1/auth/session:
    get:
      description: Bearer credential의 세션을 확인하고 idle 만료를 연장한다. 만료 · 취소 · 모르는 credential은
        401이다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.SessionResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 현재 세션
      tags:
      - auth
  /v1/onboarding:
    get:
      description: 내 온보딩 단계. mobile과 web이 같은 진행에서 이어 간다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.OnboardingResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 온보딩 진행
      tags:
      - onboarding
    put:
      consumes:
      - application/json
      description: 단계(intro · first-image)를 저장한다. 같은 단계를 다시 저장하거나 한 단계 앞으로만 갈 수 있고,
        온보딩을 마친 뒤에는 바꿀 수 없다.
      parameters:
      - description: 저장할 진행
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpserver.OnboardingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.OnboardingResponse'
        "400":
          description: 계약 밖의 진행 (invalid_onboarding)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "409":
          description: 이미 마친 온보딩 (onboarding_complete) · 건너뛰거나 되돌아가는 단계 (onboarding_out_of_order)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 온보딩 진행 저장
      tags:
      - onboarding
  /v1/onboarding/complete:
    post:
      description: |-
        첫 사진 단계(first-image)에서 온보딩을 끝낸다. 본문은 없다.
        이미 마쳤으면 그대로 성공한다 — 두 번 누르거나 다른 기기 · 탭이 먼저 마쳐도 오류가 아니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.OnboardingResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "409":
          description: 첫 사진 단계 전 (onboarding_out_of_order)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 온보딩 완료
      tags:
      - onboarding
  /v1/processing-jobs:
    get:
      description: |-
        내 처리 작업을 최근에 만든 것부터 20개까지. 온보딩 첫 사진은 온보딩을 마친 뒤에만 넣는다.
        상태는 작업 조회와 같은 규칙이다. 끝나지 못해 실패로 보는 작업에는 finishedAt이 없다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.ProcessingJobListResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 처리 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 최근 사진 처리 작업
      tags:
      - processing
    post:
      consumes:
      - multipart/form-data
      description: |-
        사진 한 장(multipart 필드 image)으로 처리 작업을 만들고 바로 돌아온다. 결과는 작업 조회로 받는다.
        JPEG · PNG · GIF · WebP만 받고 7,500,000 byte까지다. 사진은 저장하지 않는다.
        온보딩을 마치기 전의 작업은 온보딩 첫 사진으로 남아 작업 목록에 나오지 않는다.
        모든 작업은 사진 유형(text · receipt)을 판단하고, 요청 시점에 저장된 처리 방식을 selection으로 남긴 뒤 실행해 outcome(processed)에 결과를 남긴다.
        지원하지 않는 사진 · 유형을 고를 수 없는 사진 · 읽을 글자가 없는 사진은 처리 방식을 실행하지 않고 outcome(unsupported · ambiguous)으로 끝난다.
        모델 호출이 실패하거나 응답이 계약 밖이면 작업은 failed다.
        처리 방식을 읽지 못하면 기본값으로 대신하지 않고 작업을 만들지 않는다(500).
        재처리: sourceJobId와 같은 사진을 다시 보낸다. 서버는 사진을 저장하지 않고 digest로 같은 사진인지만 본다.
        분류 · 유형 판단은 다시 하지 않고 원래 작업의 분류 결과를 쓴다. 저장된 처리 방식은 바꾸지 않는다.
        처리한 작업이면 action(같은 유형의 처리 방식)이 필수이고 imageType은 비우거나 원래 유형이다.
        ambiguous 작업이면 imageType(후보 중 하나)이 필수이고, action을 비우면 그 유형에 저장된 처리 방식을 쓴다.
        unsupported · 실패 작업은 재처리할 수 없다. sourceJobId 없이 imageType · action을 보내면 400이다.
      parameters:
      - description: 사진 한 장
        in: formData
        name: image
        required: true
        type: file
      - description: 재처리할 원래 작업
        in: formData
        name: sourceJobId
        type: string
      - description: 재처리 유형
        enum:
        - text
        - receipt
        in: formData
        name: imageType
        type: string
      - description: 재처리 처리 방식
        enum:
        - extract_and_translate
        - extract_text
        - summarize
        - extract_and_summarize
        - record_expense
        in: formData
        name: action
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/httpserver.ProcessingJobResponse'
        "400":
          description: multipart가 아니거나 image 필드 없음 (invalid_image) · 원래 작업에 맞지 않는
            유형 · 처리 방식 (invalid_reprocess)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "404":
          description: 없는 · 다른 사용자의 원래 작업 (job_not_found)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "409":
          description: 다른 사진 (image_mismatch) · 원래 작업이 처리 중 (source_running) · 재처리할
            수 없는 원래 작업 (source_not_reprocessable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "413":
          description: 상한 초과 (image_too_large)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "415":
          description: 지원하지 않는 형식 (unsupported_image)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 · 처리 방식 조회 실패 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 처리 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 사진 처리 시작
      tags:
      - processing
  /v1/processing-jobs/{jobId}:
    delete:
      description: |-
        내 처리 작업 하나를 지운다. 되돌릴 수 없다. 이 작업을 다시 처리한 작업은 남고 원래 작업과의 연결만 끊긴다.
        다른 사용자의 작업은 없는 작업과 같다.
      parameters:
      - description: 지울 작업의 jobId
        in: path
        name: jobId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "404":
          description: 없는 작업 (job_not_found)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 처리 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 사진 처리 작업 삭제
      tags:
      - processing
    get:
      description: 내 처리 작업의 상태와, 완료됐다면 결과. 다른 사용자의 작업은 없는 작업과 같다.
      parameters:
      - description: 처리 시작이 돌려준 jobId
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.ProcessingJobResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "404":
          description: 없는 작업 (job_not_found)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 처리 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 사진 처리 작업
      tags:
      - processing
  /v1/processing-jobs/{jobId}/receipt-fields/{field}:
    patch:
      consumes:
      - application/json
      description: |-
        지출 정보 결과에서 필드 하나만 value로 확정하고 바뀐 뒤의 작업을 돌려준다. 다른 필드는 그대로다. 모델을 다시 부르지 않는다.
        value는 후보(candidates) 중 하나이거나 그 필드 형식의 직접 입력이다 — date: YYYY-MM-DD, total: 소수점 문자열(예: 12000, 12.50), currency: ISO 4217 코드, merchant · paymentMethod: 빈 문자열이 아닌 값.
        이미 같은 값으로 확정한 필드는 바꾸지 않고 200이다. 다른 값으로 확정한 필드는 409다.
      parameters:
      - description: 처리 작업
        in: path
        name: jobId
        required: true
        type: string
      - description: 영수증 필드
        enum:
        - merchant
        - date
        - total
        - currency
        - paymentMethod
        in: path
        name: field
        required: true
        type: string
      - description: 확정할 값
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpserver.ReceiptFieldRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.ProcessingJobResponse'
        "400":
          description: 없는 필드 · 형식이 틀린 값 · 본문 없음 (invalid_receipt_field)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "404":
          description: 없는 · 다른 사용자의 작업 (job_not_found)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "409":
          description: 지출 정보 결과가 없는 작업 (job_not_resolvable) · 다른 값으로 확정한 필드 (receipt_field_resolved)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 처리 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 영수증 필드 확정
      tags:
      - processing
  /v1/processing-jobs/delete:
    post:
      consumes:
      - application/json
      description: |-
        내 처리 작업 여러 개(1~20개)를 한 번에 지우고 지운 개수를 돌려준다. 되돌릴 수 없다. 한 번에 지워 일부만 남지 않는다.
        없거나 다른 사용자의 작업은 건너뛴다. 이 작업들을 다시 처리한 작업은 남고 원래 작업과의 연결만 끊긴다.
      parameters:
      - description: 지울 작업들
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpserver.DeleteJobsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.DeleteJobsResponse'
        "400":
          description: jobIds 없음 · 20개 초과 (invalid_job_ids)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 처리 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 사진 처리 작업 여러 개 삭제
      tags:
      - processing
  /v1/processing-preferences:
    get:
      description: '이미지 유형별 처리 방식. 고른 적이 없으면 서버 기본값(text: extract_and_translate, receipt:
        record_expense)이다.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.ProcessingPreferencesResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 처리 방식
      tags:
      - preferences
  /v1/processing-preferences/{imageType}:
    put:
      consumes:
      - application/json
      description: |-
        이미지 유형 하나의 처리 방식만 바꾸고, 바뀐 뒤의 전체를 돌려준다. 다른 유형의 값은 그대로다.
        text: extract_and_translate · extract_text · summarize · extract_and_summarize
        receipt: record_expense · extract_text · summarize
      parameters:
      - description: 이미지 유형
        enum:
        - text
        - receipt
        in: path
        name: imageType
        required: true
        type: string
      - description: 고른 처리 방식
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpserver.ProcessingPreferenceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.ProcessingPreferencesResponse'
        "400":
          description: 모르는 유형 · 그 유형에 없는 처리 방식 (invalid_preference)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: credential 없음 · 만료 · 취소 (session_expired)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: 내부 오류 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "503":
          description: 인증 비활성 (provider_unavailable)
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 처리 방식 변경
      tags:
      - preferences
securityDefinitions:
  BearerAuth:
    description: '"Bearer <opaque session credential>" 형식. 서버만 해석할 수 있는 세션 토큰.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
