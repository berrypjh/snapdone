<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" width="640" height="260">
  <title>iOS 한국어 줄바꿈 비교</title>
  <style>
    .frame { fill: none; stroke: #D0D5DD; }
    .label { font: 600 13px system-ui, sans-serif; fill: #475467; }
    .line { font: 600 19px system-ui, sans-serif; fill: #101828; }
    .error { font: 600 13px system-ui, sans-serif; fill: #B42318; }
    .accent { font: 600 13px system-ui, sans-serif; fill: #047857; }
  </style>

  <rect width="640" height="260" rx="12" fill="#FFFFFF" />
  <text class="label" x="20" y="24">기본값 — 글자 단위로 끊긴다</text>
  <rect class="frame" x="20" y="38" width="260" height="120" rx="10" />
  <text class="line" x="40" y="76">사진 한 장으로 해</text>
  <text class="line" x="40" y="106">야 할 일을 끝내세</text>
  <text class="line" x="40" y="136">요.</text>
  <text class="error" x="20" y="182">"해 / 야", "끝내세 / 요" 처럼 어절 중간에서 잘린다</text>

  <text class="label" x="360" y="24">lineBreakStrategyIOS="hangul-word"</text>
  <rect class="frame" x="360" y="38" width="260" height="120" rx="10" />
  <text class="line" x="380" y="76">사진 한 장으로</text>
  <text class="line" x="380" y="106">해야 할 일을</text>
  <text class="line" x="380" y="136">끝내세요.</text>
  <text class="accent" x="360" y="182">어절 단위로 끊긴다</text>
</svg>
