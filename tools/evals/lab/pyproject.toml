[project]
name = "snapdone-eval-lab"
version = "0.1.0"
description = "평가 dataset을 살피는 연구 공간. 정식 평가기가 아니다. 정식 평가기는 Go(apps/api/internal/evaluation)다."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jupyterlab>=4.4",
  "ipykernel>=6.29",
  "pandas>=2.3",
  "matplotlib>=3.10",
  "anthropic>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "nbformat>=5.10",
  "nbclient>=0.10",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
